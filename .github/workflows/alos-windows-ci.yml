name: ALOS Windows CI

on:
  push:
    branches:
      - ci/alos-windows-gate-3d-20260906
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full 40-character commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Lint, type-check, and build
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
    steps:
      - name: Validate target SHA
        shell: pwsh
        run: |
          if ($env:TARGET_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'TARGET_SHA must be a full 40-character commit SHA.'
          }

      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Verify exact checkout
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          $expected = $env:TARGET_SHA.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Checked out $actual instead of $expected."
          }
          Write-Host "Verified exact commit $actual"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
          cache: npm

      - name: Report toolchain
        shell: pwsh
        run: |
          node --version
          npm.cmd --version
          git --version

      - name: Install locked dependencies without lifecycle scripts
        shell: pwsh
        run: npm.cmd ci --ignore-scripts --no-audit --no-fund

      - name: Type-check
        shell: pwsh
        run: '& .\node_modules\.bin\tsc.cmd --noEmit'

      - name: Lint
        shell: pwsh
        run: npm.cmd run lint

      - name: Build
        shell: pwsh
        run: npm.cmd run build
